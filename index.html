<script>
'use strict';
/* =====================================================
   艾瑟洛斯：星陨大灾变
   Phaser3 像素地图 + 纯文字跑团叙事 · DND5E 规则引擎
   单文件实现（SRD规则引擎内置于本文件，等价 bag-of-holding）
===================================================== */

/* ---------------- 工具与随机 ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R={
  ri:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  d:s=>R.ri(1,s),
  chance:p=>Math.random()<p,
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  roll(expr){ // '2d6+3'
    const m=/^(\d*)d(\d+)([+-]\d+)?$/.exec(expr);
    if(!m)return parseInt(expr)||0;
    const n=m[1]?parseInt(m[1]):1,s=parseInt(m[2]),b=m[3]?parseInt(m[3]):0;
    let t=0;for(let i=0;i<n;i++)t+=R.d(s);return t+b;
  },
  rollD20(mod,adv){ // adv: 1优势 -1劣势 0正常
    const a=R.d(20),b=R.d(20);
    let use=a,other=null;
    if(adv>0){use=Math.max(a,b);other=Math.min(a,b);}
    else if(adv<0){use=Math.min(a,b);other=Math.max(a,b);}
    return {nat:use,other,total:use+mod,crit:use===20,fail:use===1};
  }
};

/* ---------------- 音效（Howler.ctx 合成，无外部音频文件） ---------------- */
const SFX=(()=>{
  let ctx=null,bgmNodes=null;
  function ensure(){
    if(ctx)return ctx;
    try{
      if(window.Howl&&Howler.ctx)ctx=Howler.ctx;
      else if(window.AudioContext)ctx=new AudioContext();
    }catch(e){}
    return ctx;
  }
  function tone(f,dur,type,vol,slide){
    const c=ensure();if(!c)return;
    try{
      if(c.state==='suspended')c.resume();
      const o=c.createOscillator(),g=c.createGain();
      o.type=type||'square';o.frequency.value=f;
      if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),c.currentTime+dur);
      g.gain.setValueAtTime(vol||.08,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  function seq(list){let t=0;list.forEach(x=>{setTimeout(()=>tone(x[0],x[1],x[2],x[3]),t*1000);t+=x[1]*.8;});}
  return {
    play(name){
      if(!G||!G.settings.sound)return;
      switch(name){
        case 'click':tone(660,.06,'square',.05);break;
        case 'dice':seq([[440,.05],[520,.05],[600,.05],[720,.12]]);break;
        case 'hit':seq([[300,.08,'sawtooth',.09],[180,.12,'sawtooth',.09]]);break;
        case 'crit':seq([[520,.07,'square',.1],[660,.07,'square',.1],[880,.15,'square',.1]]);break;
        case 'heal':seq([[520,.1,'sine',.09],[660,.1,'sine',.09],[880,.2,'sine',.09]]);break;
        case 'spell':seq([[880,.08,'sine',.08],[1200,.15,'sine',.08]]);break;
        case 'coin':seq([[980,.06,'square',.07],[1320,.1,'square',.07]]);break;
        case 'level':seq([[440,.1,'sine',.1],[550,.1,'sine',.1],[660,.1,'sine',.1],[880,.3,'sine',.1]]);break;
        case 'death':seq([[300,.2,'sawtooth',.1],[220,.2,'sawtooth',.1],[140,.4,'sawtooth',.1]]);break;
        case 'open':tone(520,.08,'triangle',.07);break;
        case 'quest':seq([[660,.08,'triangle',.08],[880,.2,'triangle',.08]]);break;
        case 'move':tone(220,.03,'triangle',.03);break;
      }
    },
    bgm(on){
      const c=ensure();if(!c)return;
      if(on&&!bgmNodes){
        try{
          if(c.state==='suspended')c.resume();
          const g=c.createGain();g.gain.value=.025;g.connect(c.destination);
          const o1=c.createOscillator(),o2=c.createOscillator();
          o1.type='sine';o1.frequency.value=110;o2.type='sine';o2.frequency.value=164.8;
          const lfo=c.createOscillator(),lg=c.createGain();
          lfo.frequency.value=.08;lg.gain.value=.012;
          lfo.connect(lg);lg.connect(g.gain);
          o1.connect(g);o2.connect(g);o1.start();o2.start();lfo.start();
          bgmNodes={g,o1,o2,lfo};
        }catch(e){}
      }else if(!on&&bgmNodes){
        try{bgmNodes.o1.stop();bgmNodes.o2.stop();bgmNodes.lfo.stop();bgmNodes.g.disconnect();}catch(e){}
        bgmNodes=null;
      }
    }
  };
})();

/* ---------------- 规则辅助 ---------------- */
const mod=s=>Math.floor((G.stats[s]-10)/2);
const prof=()=>2+Math.floor((G.level-1)/4);
const castMod=()=>{const c=CLASSES[G.cls];return c.casting?mod(c.casting):0;};
const spellDC=()=>8+prof()+castMod();
const spellAtk=()=>prof()+castMod();
function skillMod(name){
  const ab=SKILLS[name];if(!ab)return mod('int');
  let v=mod(ab)+(G.skills.includes(name)?prof():0);
  if(G.flags.luckcharm)v+=1;
  if(G.weather==='fog'&&(name==='察觉'||name==='生存'))v-=2;
  if(G.flags.blessStar)v+=1;
  return v;
}
function saveMod(ab){
  let v=mod(ab)+(CLASSES[G.cls].saves.includes(ab)?prof():0);
  if(G.flags.blessStar)v+=1;
  return v;
}
function armorObj(){const e=G.equip.armor;return e?ITEMS[e]:null;}
function computeAC(){
  const a=armorObj();
  let ac=a?a.ac+Math.min(mod('dex'),a.dexcap):10+mod('dex');
  if(G.equip.shield)ac+=2;
  if(G.equip.trinket==='dragonorb')ac+=0;
  return ac;
}
function slotsMaxFor(lv,cls){
  const c=CLASSES[cls];
  if(!c.casting)return [];
  return (c.castingHalf?SLOT_HALF:SLOT_FULL)[lv]||[];
}
function slotsAvail(lvl){ // lvl 从1起
  const maxArr=slotsMaxFor(G.level,G.cls);
  return (maxArr[lvl-1]||0)-(G.slotsUsed[lvl-1]||0);
}
function useSlot(lvl){ // 返回实际消耗的位阶（可高环代低环）
  for(let l=lvl;l<=5;l++){
    if(slotsAvail(l)>0){G.slotsUsed[l-1]++;return l;}
  }
  return 0;
}
function maxSpellLvl(){
  if(!CLASSES[G.cls].casting)return 0;
  const full={1:1,2:1,3:2,4:2,5:3,6:3,7:4,8:4,9:5,10:5};
  if(CLASSES[G.cls].castingHalf){const half={1:0,2:1,3:1,4:1,5:2,6:2,7:2,8:2,9:3,10:3};return half[G.level];}
  return full[G.level];
}
function weaponOf(u){ // 战斗单位用
  if(u.player){
    const wid=G.equip.weapon||'dagger';
    return ITEMS[wid];
  }
  return null;
}

/* ---------------- 背包 ---------------- */
function giveItem(id,qty){qty=qty||1;
  const it=G.inv.find(x=>x.id===id);
  if(it)it.qty+=qty;else G.inv.push({id,qty});
  Game.log('获得【'+ITEMS[id].n+'】×'+qty,'gain');SFX.play('coin');
}
function hasItem(id){return G.inv.some(x=>x.id===id&&x.qty>0);}
function removeItem(id,qty){qty=qty||1;
  const i=G.inv.findIndex(x=>x.id===id);
  if(i<0)return false;
  G.inv[i].qty-=qty;if(G.inv[i].qty<=0)G.inv.splice(i,1);return true;
}
function gainGold(n){G.gold+=n;Game.log((n>=0?'获得':'失去')+' '+Math.abs(n)+' 金币','gain');if(n>0)SFX.play('coin');renderTopbar();}
function gainXp(n){
  G.xp+=n;Game.log('获得 '+n+' 经验值','gain');
  while(G.level<10&&G.xp>=XP_TABLE[G.level+1])levelUp();
  renderTopbar();
}
function levelUp(){
  G.level++;
  const c=CLASSES[G.cls];
  const gain=Math.max(1,R.d(c.hd)+mod('con'));
  G.hpMax+=gain;G.hp=G.hpMax;
  const newSpells=(c.spells||[]).filter(sid=>SPELLS[sid].lvl<=maxSpellLvl()&&!G.spells.includes(sid));
  G.spells=G.spells.concat(newSpells);
  Game.log('等级提升！你现在是 '+G.level+' 级，生命上限 +'+gain,'sys');
  if(newSpells.length)Game.log('领悟新法术：'+newSpells.map(s=>SPELLS[s].n).join('、'),'sys');
  SFX.play('level');toast('等级提升至 '+G.level+' 级！');
}

function autoSave(){
  if(G&&G.created&&!Combat.active&&!Game.ended){
    try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));}catch(e){}
  }
}

const Game={
  log(text,cls){
    if(!G)return;
    G.log.push({t:text,c:cls||'',d:G.day});
    if(G.log.length>400)G.log.shift();
    if(curTab==='story'&&!Dlg.active)renderStory();
  },
  check(skill,dc){ // 技能检定
    const m=skillMod(skill);
    let adv=0;
    if(G.weather==='storm'&&R.chance(.1))adv=1; // 风暴中的奇迹
    const r=R.rollD20(m,adv);
    if(G.race==='halfling'&&r.nat===1&&G.luckReroll>0){
      G.luckReroll--;const r2=R.rollD20(m,adv);r2.rerolled=true;return this._checkRes(skill,dc,r2,m);
    }
    return this._checkRes(skill,dc,r,m);
  },
  _checkRes(skill,dc,r,m){
    dicePopup(skill+' 检定',(r.total)+' vs DC'+dc,r.nat+'(d20) + '+m+' = '+r.total+(r.crit?' 大成功!':''));
    SFX.play('dice');
    Game.log('【'+skill+'】d20='+r.nat+(r.other?'/'+r.other:'')+' +'+m+' = '+r.total+' vs DC'+dc+(r.total>=dc?' —— 成功':' —— 失败'),'roll');
    return {ok:r.total>=dc,total:r.total,nat:r.nat,crit:r.crit};
  },
  saveThrow(ab,dc){
    const m=saveMod(ab);
    const r=R.rollD20(m,0);
    if(G.race==='halfling'&&r.nat===1&&G.luckReroll>0){G.luckReroll--;return this.saveThrow(ab,dc);}
    dicePopup(ABILN[ab]+'豁免',r.total+' vs DC'+dc,r.nat+' + '+m);
    SFX.play('dice');
    Game.log('【'+ABILN[ab]+'豁免】'+r.total+' vs DC'+dc+(r.total>=dc?' —— 通过':' —— 失败'),'roll');
    return r.total>=dc;
  },
  remember(npc,text){
    if(!text)return;
    if(!G.memory[npc])G.memory[npc]=[];
    if(G.memory[npc].some(x=>x.t===text))return;
    G.memory[npc].push({t:text,d:G.day});
    if(G.memory[npc].length>8)G.memory[npc].shift();
  },
  qst(id,st){
    if(!G.quests[id])G.quests[id]={st:0,done:false};
    G.quests[id].st=st;
    Game.log('任务【'+QUESTS[id].n+'】更新：'+(QUESTS[id].stages[st]||'……'),'quest');SFX.play('quest');
    autoSave();renderStory();
  },
  qdone(id){
    if(!G.quests[id])G.quests[id]={st:0,done:false};
    G.quests[id].done=true;
    Game.log('任务完成【'+QUESTS[id].n+'】','quest');SFX.play('quest');
    autoSave();
  },
  favAdd(k,n){
    G.fav[k]=Math.max(0,Math.min(100,G.fav[k]+n));
    const names={church:'星辉教会',ash:'灰烬兄弟会',shadow:'幽影议会',trade:'自由商盟'};
    Game.log(names[k]+'好感 '+(n>=0?'+':'')+n+'（当前 '+G.fav[k]+'）','sys');
  },
  addShard(){
    G.shards++;giveItem('shard');
    Game.log('星核碎片（'+G.shards+'/4）已入手。位面之门在低语……','quest');
    if(!G.quests.m3)Game.qst('m3',1);
    if(G.shards>=4){Game.qst('m3',2);Game.log('四枚碎片齐鸣！去星陨坑的星核祭坛，书写终局。','quest');}
    autoSave();
  },
  unlockPlane(p,name){
    if(G.planesUnlocked[p])return;
    G.planesUnlocked[p]=true;
    Game.log('位面之门开启：【'+name+'】现已可从星陨坑传送门抵达！','quest');SFX.play('quest');
  },
  busy(){return !G||!G.created||Combat.active||Dlg.active||modalOpen()||Game.ended;},
  newGame(opts){
    G=defaultState();
    G.created=true;
    G.name=opts.name||'无名者';
    G.race=opts.race;G.cls=opts.cls;G.bg=opts.bg;
    G.stats=Object.assign({},opts.stats);
    const asi=RACES[G.race].asi||{};
    ABILS.forEach(a=>{if(asi[a])G.stats[a]+=asi[a];});
    const c=CLASSES[G.cls],rc=RACES[G.race],bg=BGS[G.bg];
    G.skills=[...c.pool].length>=c.nskill?c.pool.slice(0,c.nskill):c.pool.slice();
    if(bg.skills)bg.skills.forEach(s=>{if(!G.skills.includes(s))G.skills.push(s);});
    if(rc.skill&&!G.skills.includes(rc.skill))G.skills.push(rc.skill);
    if(G.bg==='human'){}
    G.hpMax=CLASSES[G.cls].hd+mod('con');c.gear.forEach(([id,q])=>{G.inv.push({id,qty:q});});
    G.equip.weapon=(c.gear.find(x=>ITEMS[x[0]].type==='weapon')||['dagger'])[0];
    const ar=c.gear.find(x=>ITEMS[x[0]].type==='armor');if(ar)G.equip.armor=ar[0];
    const sh=c.gear.find(x=>ITEMS[x[0]].type==='shield');if(sh)G.equip.shield=sh[0];
    G.hp=G.hpMax;
    G.gold=25+R.ri(0,10);
    if(c.spells)G.spells=c.spells.filter(sid=>SPELLS[sid].lvl<=1);
    else G.spells=[];
    G.healPool=c===CLASSES.cleric||G.cls==='cleric'?G.level*3:0;
    if(G.bg==='sage')giveItem('scroll_magic');
    G.fav.church+=G.bg==='acolyte'?10:0;
    G.fav.shadow+=G.bg==='criminal'?10:0;
    G.fav.trade+=G.bg==='folkhero'?10:0;
    G.quests={m1:{st:0,done:false}};
    initFog('material');
    Game.log('星陨之夜，天空裂开。'+G.name+'，你的传说自新月镇开始……','sys');
    Game.log('【主线】星陨之夜：与镇长艾德温谈谈（新月镇，往地图西侧走）。','quest');
    revealFog();
    switchTab('story');
    showGameUI();
    $('combatBar').classList.add('hidden');
    renderAll();
    if(scene)scene.refreshAll();
    banner('主物质位面 · 新月镇');
    autoSave();
    SFX.bgm(G.settings.bgm);
  },
  save(silent){
    try{
      localStorage.setItem(SAVE_KEY,JSON.stringify(G));
      if(!silent){Game.log('游戏已存档。','sys');toast('已存档');}
    }catch(e){toast('存档失败：'+e.message);}
  },
  load(){
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw)return false;
      G=JSON.parse(raw);
      G.created=true;
      switchTab('story');
      showGameUI();
      $('combatBar').classList.add('hidden');
      renderAll();
      if(scene)scene.refreshAll();
      Game.log('存档已读取：第'+G.day+'天，'+PLANES[G.plane].n+'。','sys');
      banner(PLANES[G.plane].n);
      return true;
    }catch(e){toast('读档失败');return false;}
  },
  ending(id){
    Game.ended=true;
    const e=ENDINGS[id];
    $('endTitle').textContent=e.n;
    $('endText').innerHTML=e.txt.replace(/\n/g,'<br>');
    const favn={church:'星辉教会',ash:'灰烬兄弟会',shadow:'幽影议会',trade:'自由商盟'};
    $('endStats').innerHTML='冒险者：'+esc(G.name)+' · '+RACES[G.race].n+CLASSES[G.cls].n+' · '+G.level+'级<br>'+
      '历时 '+G.days+' 天 · 击杀 '+G.kills+' · 金币 '+G.gold+' · 经验 '+G.xp+'<br>'+
      '阵营好感：'+Object.keys(favn).map(k=>favn[k]+' '+G.fav[k]).join(' · ')+'<br>'+
      '结局达成：'+e.n+'（共6种结局等你收集）';
    $('endingScreen').classList.remove('hidden');
    localStorage.removeItem(SAVE_KEY);
    SFX.play('level');
  }
};

   地图生成（种子确定，可复现）
===================================================== */
let MAP={cur:null,maps:{}};
const TS=24;
function idx(x,y,w){return y*w+x;}

function genOverworld(){
  const w=48,h=36,rand=mulberry32(20251025);
  const t=new Array(w*h).fill(0);
  // 生物群系
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=idx(x,y,w);
    if(y<5+Math.floor(rand()*2))t[i]=rand()<.12?2:7;              // 霜脊
    else if(x>26&&y<15&&rand()<.5)t[i]=1;                          // 迷雾森林
    else if(y>28&&x<22&&rand()<.55)t[i]=rand()<.3?3:6;             // 幽影沼泽
    else if(x>40&&y>18&&rand()<.5)t[i]=8;                          // 灰烬荒原
    else if(rand()<.06)t[i]=1;
  }
  // 湖与桥
  for(let y=20;y<25;y++)for(let x=16;x<21;x++){if((x-18)*(x-18)+(y-22)*(y-22)<6)t[idx(x,y,w)]=3;}
  t[idx(18,22,w)]=10;t[idx(18,21,w)]=10;t[idx(18,23,w)]=10;
  // 山脉点缀
  for(let i=0;i<40;i++){const x=Math.floor(rand()*w),y=Math.floor(rand()*h);if(t[idx(x,y,w)]===0)t[idx(x,y,w)]=2;}
  // 星陨坑
  for(let y=5;y<11;y++)for(let x=37;x<44;x++){const d=(x-40)*(x-40)+(y-8)*(y-8);if(d<6)t[idx(x,y,w)]=11;}
  for(let i=0;i<5;i++){t[idx(36+Math.floor(rand()*3),10+Math.floor(rand()*4),w)]=9;}
  // 王道商路（横竖）
  for(let x=2;x<47;x++)t[idx(x,17,w)]=4;
  for(let y=3;y<34;y++)t[idx(24,y,w)]=4;
  for(let x=24;x<41;x++)t[idx(x,17-Math.floor((x-24)*.2),w)]=4;
  for(let y=17;y<31;y++)t[idx(10-Math.floor((y-17)*.15),y,w)]=4;
  // 城镇地块
  function townAt(x,y){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx>0&&yy>0&&xx<w-1&&yy<h-1&&t[idx(xx,yy,w)]!==3)t[idx(xx,yy,w)]=5;}}
  townAt(8,18);townAt(12,5);townAt(42,27);townAt(7,30);townAt(24,16);
  // 城镇与地点地块保底通行
  LOCS.filter(l=>l.plane==='material').forEach(l=>{
    t[idx(l.x,l.y,w)]=l.id==='crater'?11:5;
    if(l.y+1<h&&!TILE_PASS[t[idx(l.x,l.y+1,w)]])t[idx(l.x,l.y+1,w)]=4;
    if(l.y-1>=0&&!TILE_PASS[t[idx(l.x,l.y-1,w)]])t[idx(l.x,l.y-1,w)]=4;
    if(l.x-1>=0&&!TILE_PASS[t[idx(l.x-1,l.y,w)]])t[idx(l.x-1,l.y,w)]=4;
    if(l.x+1<w&&!TILE_PASS[t[idx(l.x+1,l.y,w)]])t[idx(l.x+1,l.y,w)]=4;
  });
  return {id:'material',w,h,t};
}
function genPlane(pid){
  const w=32,h=24,rand=mulberry32(pid.length*777+42);
  const base={astral:12,elemental:12,shadow:12,fey:0}[pid];
  const t=new Array(w*h).fill(base);
  for(let i=0;i<w*h;i++){
    const r=rand();
    if(pid==='astral'&&r<.14)t[i]=2;
    if(pid==='elemental'){if(r<.12)t[i]=8;else if(r<.2)t[i]=7;}
    if(pid==='shadow'&&r<.2)t[i]=1;
    if(pid==='fey'&&r<.3)t[i]=1;
  }
  // 障碍带
  for(let k=0;k<8;k++){
    const cx=4+Math.floor(rand()*(w-8)),cy=4+Math.floor(rand()*(h-8)),rad=1+Math.floor(rand()*2);
    for(let y=cy-rad;y<=cy+rad;y++)for(let x=cx-rad;x<=cx+rad;x++){
      if(x<0||y<0||x>=w||y>=h)continue;
      const i=idx(x,y,w);
      if(pid==='astral')t[i]=2;else if(pid==='elemental')t[i]=rand()<.5?8:7;
      else if(pid==='shadow')t[i]=3;else t[i]=1;
    }
  }
  // 位面关键点保底通行
  LOCS.filter(l=>l.plane===pid).forEach(l=>{
    t[idx(l.x,l.y,w)]=base;
    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy])=>{
      const xx=l.x+dx,yy=l.y+dy;
      if(xx>=0&&yy>=0&&xx<w&&yy<h)t[idx(xx,yy,w)]=base;
    });
  });
  return {id:pid,w,h,t};
}
function getMap(pid){
  if(!MAP.maps[pid]){
    MAP.maps[pid]=pid==='material'?genOverworld():genPlane(pid);
  }
  return MAP.maps[pid];
}
function initFog(pid){
  if(G.fog[pid])return;
  const m=getMap(pid);
  G.fog[pid]=new Array(m.w*m.h).fill(0);
}
function regionAt(x,y){
  if(G.plane!=='material')return {id:G.plane,n:PLANES[G.plane].n};
  for(const r of REGIONS){const [x1,y1,x2,y2]=r.rect;if(x>=x1&&x<=x2&&y>=y1&&y<=y2)return r;}
  return REGIONS[0];
}

  const q=QUESTS[id],st=G.quests[id];
  if(!st||st.done&&q.stages.length<=1)return q.n;

}

/* =====================================================
   战斗（网格回合制，DND5E 规则）
===================================================== */
const Combat={
  active:false,units:[],order:[],turn:0,round:1,arena:null,
  phase:'move',moved:false,acted:false,reach:null,curSel:null,retreatedPos:null,
  onWin:null,intro:'',theme:'plains',unitSeq:0,

  start(cfg){
    // cfg: {monsters:[[id,count]...], intro, onWin, theme, ally?}
    if(this.active)return;
    this.active=true;this.onWin=cfg.onWin||null;this.intro=cfg.intro||'';
    this.theme=cfg.theme||regionAt(G.x,G.y).id;
    this.retreatedPos={x:G.x,y:G.y};
    this.arena=this.buildArena(this.theme);
    this.units=[];this.turn=0;this.round=1;this.moved=false;this.acted=false;this.phase='move';this.curSel=null;
    // 玩家单位
    this.units.push(this.makePlayerUnit());
    // 敌人
    (cfg.monsters||[]).forEach(([id,cnt])=>{
      for(let i=0;i<cnt;i++){
        const m=MONSTERS[id];
        if(!m)continue;
        let x,y,tries=0;
        do{x=R.ri(this.arena.w-4,this.arena.w-1);y=R.ri(0,this.arena.h-1);tries++;}
        while(tries<30&&(this.arena.t[idx(x,y,this.arena.w)]===undefined||!TILE_PASS[this.arena.t[idx(x,y,this.arena.w)]]||this.units.some(u=>u.x===x&&u.y===y)));
        this.units.push({uid:'e'+(++this.unitSeq),tid:id,name:m.n+(cnt>1?('·'+i+1):''),side:'e',m:m,hp:m.hp,hpMax:m.hp,ac:m.ac,speed:Math.round((m.spd||30)/5),x,y,cond:{},oaDone:false});
      }
    });
    // 先攻
    this.units.forEach(u=>{
      u.init=R.rollD20(u.player?mod('dex'):Math.floor(((u.m.spd||30)-10)/2),0).total;
    });
    this.order=[...this.units].sort((a,b)=>b.init-a.init).map(u=>u.uid);
    Game.log('—— 战斗开始 ——','combat');
    if(this.intro)Game.log(this.intro,'combat');
    this.order.forEach(uid=>{const u=this.units.find(x=>x.uid===uid);Game.log('先攻 · '+u.name+'：'+u.init,'combat');});
    if(scene)scene.enterCombat();
    this.showBar();
    renderStory();
    this.beginTurn();
  },
  makePlayerUnit(){
    const u={uid:'p',player:true,name:G.name,side:'p',hp:G.hp,hpMax:G.hpMax,ac:computeAC(),speed:6,x:2,y:Math.floor(this.arena.h/2),cond:{},oaDone:false};
    u.weapons=this.playerWeapons();
    return u;
  },
  playerWeapons(){
    const list=[];
    const wid=G.equip.weapon||'dagger';
    const w=ITEMS[wid];
    const ab=w.ranged?'dex':(w.fin?Math.max(mod('str'),mod('dex')):mod('str'));
    list.push({id:wid,n:w.n,dmg:w.dmg,rng:w.rng||1,tb:prof()+ab,dmgMod:ab,ranged:!!w.ranged,magic:!!w.magic});
    if(G.equip.weapon!=='dagger')list.push({id:'dagger',n:'匕首',dmg:'1d4',rng:1,tb:prof()+Math.max(mod('str'),mod('dex')),dmgMod:Math.max(mod('str'),mod('dex')),fin:1});
    // 龙息
    if(G.race==='dragonborn'&&!G.breathUsed)list.push({id:'breath',n:'龙息',special:'breath'});
    return list;
  },
  buildArena(theme){
    const w=13,h=9;
    const base={astral:12,elemental:12,shadow:12,fey:12}[theme]!==undefined?12:0;
    const t=new Array(w*h).fill(base);
    const obst={forest:1,marsh:6,frost:2,ashen:8,crater:2,road:2,plains:2,astral:2,elemental:8,shadow:3,fey:1}[theme]||2;
    for(let i=0;i<10;i++){
      const x=R.ri(3,w-2),y=R.ri(0,h-1);
      if(!(x===2&&y===Math.floor(h/2)))t[idx(x,y,w)]=obst;
    }
    return {w,h,t};
  },
  unit(u){return this.units.find(x=>x.uid===u);},
  occ(exclude){
    const s=new Set();
    this.units.forEach(u=>{if(!u.dead&&u.uid!==exclude)s.add(u.x+','+u.y);});
    return s;
  },
  bfs(unit,maxSteps){
    const {w,h,t}=this.arena;
    const dist={},prev={},q=[[unit.x,unit.y]];
    dist[unit.x+','+unit.y]=0;
    while(q.length){
      const [cx,cy]=q.shift();const d0=dist[cx+','+cy];
      if(d0>=maxSteps)continue;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx,ny=cy+dy,k=nx+','+ny;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        if(!TILE_PASS[t[ny*w+nx]])continue;
        if(this.occ(unit.uid).has(k))continue;
        if(dist[k]!==undefined)continue;
        dist[k]=d0+1;prev[k]=cx+','+cy;q.push([nx,ny]);
      }
    }
    return {dist,prev};
  },
  adjacentEnemies(u){
    return this.units.filter(e=>!e.dead&&e.side!==u.side&&Math.abs(e.x-u.x)+Math.abs(e.y-u.y)===1);
  },
  distance(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);},

  beginTurn(){
    if(!this.active)return;
    const u=this.unit(this.order[this.turn]);
    if(!u||u.dead){this.nextTurn();return;}
    u.oaDone=false;
    if(u.side==='e'){this.enemyAct(u);return;}
    // 玩家回合
    this.moved=false;this.acted=false;this.phase='move';this.reach=null;
    if(u.hp<=0){this.deathSave(u);return;}
    // 回合开始：护盾/印记衰减
    if(u.cond.shield){delete u.cond.shield;Game.log('护盾术效果消散。','roll');}
    this.showBar();
  },
  nextTurn(){
    this.turn++;
    if(this.turn>=this.order.length){this.turn=0;this.round++;}
    this.beginTurn();
  },
  /* ---- 敌人AI ---- */
  enemyAct(u){
    if(u.m.tag&&u.m.tag==='undead'&&(u.m.n==='暗影'||u.m.n==='幽灵')&&G.weather==='clear'&&isDaytime()&&G.plane==='material'){
      Game.log(u.name+' 在日光下畏缩，退散了！','combat');
      u.dead=true;this.checkEnd();return;
    }
    if(u.hp<=0){this.nextTurn();return;}
    const p=this.units.find(x=>x.uid==='p'&&!x.dead);
    if(!p||p.hp<=0){ // 玩家倒地：过轮
      Game.log(u.name+' 逡巡不前，等待你的心跳停下……','combat');
      this.showBar();
      setTimeout(()=>this.nextTurn(),600);
      return;
    }
    const acts=[];
    // 呼吸吐息
    if(u.m.breath&&this.round%u.m.breath.cool===0){
      acts.push(()=>this.enemyBreath(u,p));
    }
    // 移动+攻击
    acts.push(()=>{
      const atk=this.pickAttack(u,p);
      const need=atk.rng||1;
      let d=this.distance(u,p);
      if(d>need){
        const reach=this.bfs(u,u.speed);
        // 找到距玩家 need 内的最近可站格
        let best=null,bd=99;
        for(const k in reach.dist){
          const [x,y]=k.split(',').map(Number);
          const dd=Math.abs(x-p.x)+Math.abs(y-p.y);
          if(dd<=need&&dd<bd){bd=dd;best=[x,y];}
        }
        if(!best){ // 靠近
          let bd2=99;
          for(const k in reach.dist){
            const [x,y]=k.split(',').map(Number);
            const dd=Math.abs(x-p.x)+Math.abs(y-p.y);
            if(dd<bd2){bd2=dd;best=[x,y];}
          }
        }
        if(best)this.moveAlong(u,best[0],best[1],reach.prev);
      }
      d=this.distance(u,p);
      if(d<=(atk.rng||1)){
        // 双持/多次攻击
        const times=u.m.two?2:1;
        for(let i=0;i<times;i++)this.attack(u,p,atk);
      }else Game.log(u.name+' 逼近中……','combat');
    });
    let i=0;
    const run=()=>{if(!this.active)return;if(i<acts.length){acts[i++]();if(this.active&&!this.checkEnd())setTimeout(run,350);}else{this.showBar();setTimeout(()=>this.nextTurn(),400);}};
    run();
  },
  pickAttack(u,target){
    const list=u.m.atk;
    const d=this.distance(u,target);
    let best=null,bp=-1;
    list.forEach(a=>{
      const rng=a.rng||1;
      let p=rng>=d?10:0;
      if(a.dmg&&rng>=d)p+=parseInt(a.dmg)+2;
      if(p>bp){bp=p;best=a;}
    });
    return best||list[0];
  },
  enemyBreath(u,p){
    const b=u.m.breath;
    Game.log(u.name+' 释放【'+b.name+'】！','combat');
    SFX.play('spell');
    const inArea=this.units.filter(t=>!t.dead&&t.side!==u.side&&this.distance(u,t)<=3);
    inArea.forEach(t=>{
      const hitSave=t.player?Game.saveThrow(b.abil,b.dc):R.rollD20(2,0).total>=b.dc;
      let dmg=R.roll(b.dmg);
      if(hitSave&&b.half)dmg=Math.floor(dmg/2);
      if(hitSave)Game.log(t.name+' 通过豁免，伤害减半。','roll');
      this.applyDamage(t,dmg,b.type,u);
    });
  },
  /* ---- 移动（含借机攻击） ---- */
  moveAlong(u,tx,ty,prev){
    // 重构路径
    const path=[];let k=tx+','+ty;
    while(k&&k!==u.x+','+u.y){const [x,y]=k.split(',').map(Number);path.unshift([x,y]);k=prev[k];}
    for(const [x,y] of path){
      const wasAdj=this.adjacentEnemies(u);
      u.x=x;u.y=y;
      if(u.player&&!u.oaDone){
        for(const e of wasAdj){
          if(e.dead||e.oaDone)continue;
          if(this.distance(e,u)>1){ // 离开其触及范围才引发借机
            e.oaDone=true;
            Game.log(e.name+' 的借机攻击！','combat');
            this.attack(e,u,this.pickAttack(e,u));
            if(u.hp<=0)break;
          }
        }
      }
      if(u.hp<=0)break;
    }
    if(scene)scene.drawCombat();
  },
  doMove(tx,ty){
    const u=this.unit('p');
    if(this.acted){Game.log('本回合已用动作，无法再移动（先移动或结束回合）。','combat');return;}
    if(u.cond.grappled){Game.log('你被擒抱，无法移动！','combat');return;}
    const reach=this.bfs(u,u.speed);
    const k=tx+','+ty;
    if(reach.dist[k]===undefined){Game.log('移动范围不足（速度 '+u.speed*5+' 尺）。','combat');return;}
    this.moveAlong(u,tx,ty,reach.prev);
    this.moved=true;
    this.showBar();
  },
  /* ---- 攻击 ---- */
  attack(att,def,wpn){
    if(!wpn){Game.log('没有可用的攻击方式。','combat');return;}
    // 优势/劣势
    let adv=0;
    if(att.cond.invis)adv++;
    if(def.cond.dodge)adv--;
    if(def.cond.invis)adv--;
    if(def.cond.prone&&!(wpn.ranged||wpn.rng>1))adv++;
    if(att.cond.prone)adv--;
    if(G.weather==='rain'&&(wpn.ranged||wpn.rng>1))adv--;
    const atkName=wpn.name||wpn.n;
    const tb=att.player?wpn.tb:(wpn.tb||0);
    const r=R.rollD20(tb,adv);
    if(att.player&&G.race==='halfling'&&r.nat===1&&G.luckReroll>0){G.luckReroll--;return this.attack(att,def,wpn);}
    const label=att.player?'你':'';
    Game.log((att.player?'你':att.name)+'使用【'+atkName+'】攻击'+(def.player?'你':def.name)+'：d20='+r.nat+(r.other?'/'+r.other:'')+' + '+tb+' = '+r.total+' vs AC '+def.ac,'combat');
    if(r.nat===1){Game.log('—— 大失手！','combat');SFX.play('click');return;}
    if(r.total<def.ac&&!r.crit){Game.log('—— 未命中。','combat');SFX.play('click');return;}
    // 伤害
    let dmg=R.roll(wpn.dmg);
    if(att.player)dmg+=(wpn.dmgMod||0);
    if(r.crit){dmg+=R.roll(wpn.dmg);Game.log('会心一击！伤害骰翻倍！','combat');SFX.play('crit');}
    // 玩家附加
    if(att.player){
      if(def.cond.marked)dmg+=R.roll('1d6');
      if(G.cls==='rogue'&&adv>0){
        const sd=Math.floor((G.level+1)/2);
        dmg+=R.roll(sd+'d6');
        Game.log('偷袭！附加 '+sd+'d6 精准伤害。','combat');
      }
      if(wpn.id==='starblade')dmg+=R.roll('1d4');
    }
    this.applyDamage(def,dmg,wpn.type||'挥砍',att);
  },
  applyDamage(def,dmg,type,src){
    if(def.hp<=0)return;
    if(def.player&&type==='火焰'&&(G.race==='tiefling'||G.flags.fireRes===G.day))dmg=Math.floor(dmg/2);
    def.hp-=dmg;
    SFX.play('hit');
    Game.log((def.player?'你':def.name)+'受到 '+dmg+' 点'+(type||'')+'伤害（HP '+Math.max(0,def.hp)+'/'+def.hpMax+'）','combat');
    if(def.hp<=0){
      if(def.player){
        def.hp=0;
        Game.log('你倒在了血泊中！每轮需进行死亡豁免。','combat');SFX.play('death');
      }else{
        def.dead=true;
        Game.log(def.name+' 倒下了！','combat');
        if(def.m.tag==='undead')G.flags.undeadKills=(G.flags.undeadKills||0)+1;
        if(def.tid==='yeti')setF('yetiDead');
        G.kills++;
        this.checkEnd();
      }
    }
    if(scene)scene.drawCombat();
  },
  checkEnd(){
    if(!this.active)return false;
    const enemies=this.units.filter(u=>u.side==='e'&&!u.dead);
    if(enemies.length===0){
      this.finish(true);
      return true;
    }
    return false;
  },
  finish(victory){
    this.active=false;
    const pu=this.units.find(x=>x.uid==='p');
    if(pu)G.hp=Math.max(0,pu.hp);
    if(scene)scene.exitCombat();
    if(victory){
      let xp=0,gold=0;
      this.units.filter(u=>u.side==='e').forEach(u=>{
        xp+=MON_XP[u.m.cr]||50;
        const [a,b]=u.m.loot||[0,0];gold+=R.ri(a,b);
      });
      Game.log('—— 战斗胜利！——','combat');
      gainGold(gold);
      if(gold>0)Game.log('搜刮战利品，得到 '+gold+' 金币。','gain');
      gainXp(xp);
      // 随机掉落
      if(R.chance(.18))giveItem(R.pick(TREASURE_ITEMS));
      const cb=this.onWin;this.onWin=null;
      if(cb)cb();
      autoSave();
    }
    if(scene)scene.refreshAll();
    renderStory();renderTopbar();
  },
  retreat(){
    const u=this.unit('p');
    Game.log('你选择撤退！','combat');
    this.adjacentEnemies(u).forEach(e=>{
      if(!e.oaDone){e.oaDone=true;Game.log(e.name+' 的借机攻击！','combat');this.attack(e,u,this.pickAttack(e,u));}
    });
    if(u.hp<=0)return;
    this.active=false;
    const pu=this.units.find(x=>x.uid==='p');
    if(pu)G.hp=Math.max(0,pu.hp);
    if(scene)scene.exitCombat();
    Game.log('你脱离了战斗。','combat');
    this.units=[];
    renderStory();
  },
  deathSave(u){
    // 玩家死亡豁免
    const s=R.d(20);
    let msg;
    if(s===20){u.hp=1;msg='自然20！你猛然睁开眼，恢复1点生命！';}
    else if(s>=10){u.cond.dsucc=(u.cond.dsucc||0)+1;msg='成功（'+u.cond.dsucc+'/3）';}
    else if(s===1){u.cond.dfail=(u.cond.dfail||0)+2;msg='大失败（失败'+u.cond.dfail+'/3）';}
    else{u.cond.dfail=(u.cond.dfail||0)+1;msg='失败（'+u.cond.dfail+'/3）';}
    Game.log('死亡豁免：d20='+s+' —— '+msg,'combat');
    SFX.play('dice');
    if(u.hp>0){this.showBar();return;}
    if((u.cond.dfail||0)>=3){
      this.active=false;
      if(scene)scene.exitCombat();
      Game.log('你的传说终结于第 '+G.day+' 天。','sys');
      gameOverModal();
      return;
    }
    if((u.cond.dsucc||0)>=3){
      Game.log('你稳定了下来！挣扎着爬出战场……','combat');
      u.hp=1;G.hp=1;
      this.active=false;
      if(scene)scene.exitCombat();
      this.units=[];
      renderStory();return;
    }
    this.showBar();
    setTimeout(()=>this.nextTurn(),900);
  },
  /* ---- 玩家动作 ---- */
  modeAtk(w){this.phase='atk';this.curSel=w;this.showBar();Game.log('选择攻击目标（点击敌人）。','combat');},
  doAttackTarget(defUid){
    const u=this.unit('p'),def=this.unit(defUid);
    if(!def||def.dead)return;
    const w=this.curSel;
    const d=this.distance(u,def);
    if(d>(w.rng||1)){Game.log('目标超出射程（'+(w.rng||1)*5+'尺）。','combat');return;}
    this.acted=true;
    this.attack(u,def,w);
    this.phase='move';this.curSel=null;
    if(!this.checkEnd())this.endPlayerTurn();
  },
  doCastSpell(spellId,targetUidOrPos){
    const sp=SPELLS[spellId];
    const u=this.unit('p');
    if(!sp)return;
    if(slotsAvail(sp.lvl)<=0&&sp.lvl>0){Game.log('没有可用的 '+sp.lvl+' 环法术位！','combat');return;}
    const lvlUsed=sp.lvl>0?useSlot(sp.lvl):0;
    G.spellsUsedNote=sp.n;
    SFX.play('spell');
    Game.log('你施展【'+sp.n+'】'+(lvlUsed>sp.lvl?'（'+lvlUsed+'环位）':'')+'。','combat');
    if(sp.heal){
      const amount=R.roll(sp.heal)+castMod();
      u.hp=Math.min(u.hpMax,u.hp+amount);
      Game.log('恢复 '+amount+' 点生命（HP '+u.hp+'/'+u.hpMax+'）。','gain');
      SFX.play('heal');
      G.hp=Math.min(G.hpMax,u.hp);
    }else if(sp.ac){
      u.cond.shield=true;u.ac+=5;
      Game.log('护盾术！AC 暂时 +5。','combat');
    }else if(sp.invis){
      u.cond.invis=true;
      Game.log('你从视野中消失了。','combat');
    }else if(sp.mark){
      Game.log('猎人印记生效：对目标伤害+1d6。选择目标。','combat');
      this.phase='mark';this.curSel=sp;
      this.showBar();return;
    }else if(sp.rest){
      delete u.cond.para;delete u.cond.charm;
      Game.log('次级复原术：解除麻痹与魅惑。','combat');
    }else if(sp.self){
      Game.log('法术生效。','combat');
    }else if(sp.area||sp.cone||sp.line){
      // 范围法术：以最近敌人为中心/锥形
      const targets=this.units.filter(t=>!t.dead&&t.side==='e'&&(sp.cone?this.distance(u,t)<=3:this.distance(u,t)<=sp.rng));
      if(!targets.length){Game.log('范围内没有目标，法术落空。','combat');}
      else{
        Game.log((sp.area?'爆裂扩散':sp.cone?'锥形喷发':'电光疾驰')+'！','combat');
        targets.forEach(t=>{
          const saveOk=t.player?Game.saveThrow(sp.save,spellDC()):(R.rollD20(1,0).total+2)>=spellDC();
          let dmg=R.roll(sp.dmg);
          if(saveOk&&sp.half)dmg=Math.floor(dmg/2);
          this.applyDamage(t,dmg,sp.type,u);
        });
      }
    }else if(sp.save){
      const t=this.unit(targetUidOrPos);
      if(!t){Game.log('需要目标。','combat');return;}
      const saveOk=t.player?Game.saveThrow(sp.save,spellDC()):(R.rollD20(1,0).total+2)>=spellDC();
      let dmg=R.roll(sp.dmg);
      if(sp.scal==='cantrip')dmg+=R.roll(Math.ceil(G.level/6)+'d6'); // 戏法成长简化
      if(saveOk&&sp.half)dmg=Math.floor(dmg/2);
      if(sp.charm&&!saveOk){t.cond.charm=1;Game.log(t.name+' 被魅惑！','combat');}
      this.applyDamage(t,dmg,sp.type,u);
    }else if(sp.atk){
      const t=this.unit(targetUidOrPos);
      if(!t){Game.log('需要目标。','combat');return;}
      const rays=sp.rays||1;
      for(let i=0;i<rays;i++){
        const d=this.distance(u,t);
        if(d>sp.rng){Game.log('目标超出射程。','combat');break;}
        const r=R.rollD20(spellAtk(),t.cond.invis?-1:0);
        Game.log('射线'+(i+1)+'：d20='+r.nat+' + '+spellAtk()+' = '+r.total+' vs AC '+t.ac,'combat');
        if(r.total>=t.ac||r.crit){
          let dmg=R.roll(sp.dmg);
          if(r.crit)dmg+=R.roll(sp.dmg);
          if(sp.scal==='cantrip')dmg+=R.roll(Math.ceil(G.level/6)+'d4');
          this.applyDamage(t,dmg,sp.type,u);
        }else Game.log('—— 未命中。','combat');
      }
    }else if(sp.auto){
      const t=this.unit(targetUidOrPos)||this.nearestEnemy();
      if(t){
        let dmg=R.roll(sp.dmg);
        this.applyDamage(t,dmg,sp.type,u);
      }
    }
    G.hp=Math.min(u.hp,G.hpMax);
    this.acted=true;this.phase='move';this.curSel=null;
    if(scene)scene.drawCombat();
    if(!this.checkEnd())this.endPlayerTurn();
  },
  nearestEnemy(){
    const u=this.unit('p');
    let best=null,bd=99;
    this.units.forEach(t=>{if(t.side==='e'&&!t.dead){const d=this.distance(u,t);if(d<bd){bd=d;best=t;}}});
    return best;
  },
  doMark(targetUid){
    const t=this.unit(targetUid);
    const u=this.unit('p');
    if(!t||t.dead)return;
    t.cond.marked=1;
    Game.log('你将猎人印记烙在 '+t.name+' 身上。','combat');
    this.acted=true;this.phase='move';this.curSel=null;
    if(!this.checkEnd())this.endPlayerTurn();
  },
  useItemCombat(invIdx){
    const it=G.inv[invIdx];
    if(!it)return;
    const item=ITEMS[it.id];
    if(item.heal){
      const u=this.unit('p');
      const amount=R.roll(item.heal);
      u.hp=Math.min(u.hpMax,u.hp+amount);G.hp=u.hp;
      removeItem(it.id);
      Game.log('你喝下【'+item.n+'】，恢复 '+amount+' 生命。','gain');SFX.play('heal');
    }else if(item.cast){
      const spId=item.cast;removeItem(it.id);
      this.doCastSpell(spId);
      return;
    }else if(it.id==='dragonorb'){
      const u=this.unit('p');
      if(G.flags.orbUsedDay===G.day){Game.log('宝珠今日之力已耗尽。','combat');return;}
      setF2('orbUsedDay',G.day);
      Game.log('龙息宝珠喷吐烈焰！','combat');
      this.units.filter(t=>!t.dead&&t.side==='e'&&this.distance(u,t)<=3).forEach(t=>{
        const ok=t.player?false:R.rollD20(2,0).total>=13;
        let dmg=R.roll('4d6');if(ok)dmg=Math.floor(dmg/2);
        this.applyDamage(t,dmg,'火焰',u);
      });
    }else{Game.log('该物品无法在战斗中使用。','combat');return;}
    this.acted=true;
    if(!this.checkEnd())this.endPlayerTurn();
  },
  dodge(){
    const u=this.unit('p');
    u.cond.dodge=true;
    Game.log('你摆出防御姿态（受到的攻击具有劣势）。','combat');
    this.acted=true;
    this.endPlayerTurn();
  },
  dash(){
    this.phase='move';this.moved=false;
    const u=this.unit('p');
    u.speed*=2;
    Game.log('疾行！本回合移动速度翻倍。','combat');
    this.acted=true; // 疾行占用动作
    this.showBar();
  },
  disengage(){
    const u=this.unit('p');
    u.oaDone=true; // 简化：本轮不再受借机
    Game.log('你谨慎地脱离接触（不会引发借机攻击）。','combat');
    this.acted=true;
    this.showBar();
  },
  secondWind(){
    const u=this.unit('p');
    if(G.flags.swUsed===G.day){Game.log('回气已用过（需短休恢复）。','combat');return;}
    const amount=R.roll('1d10')+G.level;
    u.hp=Math.min(u.hpMax,u.hp+amount);G.hp=u.hp;
    setF2('swUsed',G.day);
    Game.log('回气！恢复 '+amount+' 生命。','gain');SFX.play('heal');
    this.acted=true;
    this.endPlayerTurn();
  },
  healLay(){
    const u=this.unit('p');
    if(G.healPool<=0){Game.log('圣疗生命池已空（长休恢复）。','combat');return;}
    const amount=Math.min(G.healPool,5*G.level);
    u.hp=Math.min(u.hpMax,u.hp+amount);G.hp=u.hp;G.healPool-=amount;
    Game.log('圣疗！恢复 '+amount+' 生命（剩余池 '+G.healPool+'）。','gain');SFX.play('heal');
    this.acted=true;
    this.endPlayerTurn();
  },
  smite(){
    const u=this.unit('p');
    if(slotsAvail(1)<=0){Game.log('没有1环法术位可用！','combat');return;}
    this.phase='smite';this.curSel={id:'smite',n:'神圣斩击',dmg:'1d8',rng:1};
    Game.log('选择挥击目标：命中后消耗1环位，附加+2d8光耀伤害。','combat');
    this.showBar();
  },
  doSmiteTarget(defUid){
    const u=this.unit('p'),def=this.unit(defUid);
    if(!def||def.dead)return;
    if(this.distance(u,def)>1){Game.log('目标不在近战范围。','combat');return;}
    useSlot(1);
    this.acted=true;
    // 先普攻
    const w=this.playerWeapons()[0];
    const preHp=def.hp;
    this.attack(u,def,w);
    if(def.hp<preHp){
      const dmg=R.roll('2d8');
      this.applyDamage(def,dmg,'光耀',u);
      Game.log('神圣斩击引爆！+2d8 光耀伤害。','combat');
    }else Game.log('神圣斩击落空，法术位已消耗。','combat');
    this.phase='move';this.curSel=null;
    if(!this.checkEnd())this.endPlayerTurn();
  },
  breathAttack(){
    const u=this.unit('p');
    if(G.breathUsed){Game.log('龙息尚未恢复（短休恢复）。','combat');return;}
    G.breathUsed=true;
    const dc=8+prof()+mod('con');
    const dice=(2+Math.floor(G.level/4))+'d6';
    Game.log('你喷吐龙息！','combat');SFX.play('spell');
    this.units.filter(t=>!t.dead&&t.side==='e'&&this.distance(u,t)<=2).forEach(t=>{
      const ok=R.rollD20(2,0).total>=dc;
      let dmg=R.roll(dice);if(ok)dmg=Math.floor(dmg/2);
      this.applyDamage(t,dmg,'火焰',u);
    });
    this.acted=true;
    if(!this.checkEnd())this.endPlayerTurn();
  },
  endPlayerTurn(){

        });

      if(G.cls==='cleric')html+='<button class="btn btn-green" onclick="Combat.healLay()">圣疗('+G.healPool+')</button>';
      // 药水
      G.inv.forEach((it,i)=>{
        if(ITEMS[it.id].heal)html+='<button class="btn btn-green" onclick="Combat.useItemCombat('+i+')">'+esc(ITEMS[it.id].n)+'</button>';
      });

      html+='<button class="btn" onclick="Combat.disengage()">撤离姿态</button>';
      html+='<button class="btn btn-red" onclick="Combat.retreat()">逃跑</button>';

      html+='</div>';

  uiMove(){this.phase='move';this.curSel=null;this.showBar();},
  uiCast(sid){this.phase='cast';this.curSel=sid;
    const sp=SPELLS[sid];
    if(sp.heal||sp.ac||sp.invis||sp.rest||sp.self){this.doCastSpell(sid);return;}
    if(sp.auto){this.doCastSpell(sid,this.nearestEnemy()?this.nearestEnemy().uid:null);return;}
    Game.log('点击目标施展【'+sp.n+'】。','combat');this.showBar();
  },
  onClick(tx,ty){
    if(!this.active)return;
    const u=this.unit('p');
    if(!u||u.hp<=0)return;
    if(this.unit(this.order[this.turn])!==u)return;
    if(this.phase==='atk'&&this.curSel)return this.doAttackTarget(this.uidAt(tx,ty));
    if(this.phase==='cast'&&this.curSel)return this.doCastSpell(this.curSel,this.uidAt(tx,ty));
    if(this.phase==='mark'&&this.curSel)return this.doMark(this.uidAt(tx,ty));
    if(this.phase==='smite'&&this.curSel)return this.doSmiteTarget(this.uidAt(tx,ty));
    this.doMove(tx,ty);
  },
  uidAt(tx,ty){
    const t=this.units.find(x=>!x.dead&&x.side==='e'&&x.x===tx&&x.y===ty);
    return t?t.uid:null;
  }
};
function setF2(k,v){G.flags[k]=v;}
function isDaytime(){return G.time>=300&&G.time<1080;}
window.Combat=Combat;

/* =====================================================
   探索移动
===================================================== */
function revealFog(){
  const m=getMap(G.plane);
  if(!G.fog[G.plane])initFog(G.plane);
  const r=6+(RACES[G.race].dark?2:0)+(f('blessStar')?1:0);
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const x=G.x+dx,y=G.y+dy;
    if(x<0||y<0||x>=m.w||y>=m.h)continue;
    if(dx*dx+dy*dy<=r*r)G.fog[G.plane][idx(x,y,m.w)]=1;
  }
}
function rollWeather(){
  const roll=Math.random();
  if(G.plane==='material'){
    G.weather=roll<.55?'clear':roll<.75?'rain':roll<.9?'fog':'storm';
  }else if(G.plane==='astral')G.weather='clear';
  else if(G.plane==='elemental')G.weather=roll<.5?'clear':'storm';
  else if(G.plane==='shadow')G.weather='fog';
  else G.weather='clear';
}
function timeTick(){
  G.time+=10;
  if(G.time>=1440){G.time-=1440;G.day++;G.days++;rollWeather();
    Game.log('—— 第 '+G.day+' 天 · 天气：'+({clear:'晴',rain:'雨',fog:'雾',storm:'暴风雨'}[G.weather])+' ——','sys');
    if(f('invested')){gainGold(50);Game.log('商盟分红 +50 金币。','gain');}
    G.flags.orbUsedDay=0;
  }
}
function tryMove(dx,dy){
  if(Game.busy())return;
  const m=getMap(G.plane);
  const nx=G.x+dx,ny=G.y+dy;
  if(nx<0||ny<0||nx>=m.w||ny>=m.h)return;
  const t=m.t[idx(nx,ny,m.w)];
  if(!TILE_PASS[t]){if(R.chance(.15))Game.log('前方是'+'无法通行的地形。');return;}
  G.x=nx;G.y=ny;
  SFX.play('move');
  revealFog();timeTick();
  if(G.encounterCd>0)G.encounterCd--;
  // 地点触发
  const loc=locAt(nx,ny);
  if(loc){enterLoc(loc);renderAll();return;}
  // 随机遭遇
  if(G.encounterCd<=0&&rollEncounter())return;
  // 野外小事件
  if(R.chance(.045)){wildEvent();}
  renderAll();
}
function wildEvent(){
  const evs=['shrine','cache','trap','rumor'];
  if(f('finnQ')&&(G.flags.pageCount||0)<3)evs.push('page','page');
  if(f('magQ')&&(G.flags.herbCount||0)<3)evs.push('herb');
  if(f('bloomQ')&&!hasItem('ore'))evs.push('ore');
  const ev=R.pick(evs);
  switch(ev){
    case 'shrine':{
      Game.log('路边有座荒废的小神龛。','sys');
      const ok=Game.saveThrow('wis',10);
      if(ok){G.hp=Math.min(G.hpMax,G.hp+R.roll('2d4+2'));Game.log('圣辉微光拂过，伤势缓解。','gain');SFX.play('heal');}
      else Game.log('神龛沉默不语。');
      renderTopbar();
      break;}
    case 'cache':{
      Game.log('你发现了一处旅人遗落的行囊。','gain');
      gainGold(R.ri(5,40));
      if(R.chance(.3))giveItem(R.pick(TREASURE_ITEMS));
      break;}
    case 'trap':{
      Game.log('脚下嘎吱一响——陷阱！','combat');
      const ok=Game.saveThrow('dex',12);
      if(!ok){
        const dmg=R.roll('1d10');G.hp=Math.max(0,G.hp-dmg);
        Game.log('尖刺造成 '+dmg+' 点穿刺伤害！','combat');
        renderTopbar();
        if(G.hp<=0){G.hp=0;gameOverModal();}
      }else Game.log('你侧身避开了尖刺。');
      break;}
    case 'rumor':Game.log('路旁刻着褪色的字迹：'+R.pick(RUMORS),'sys');break;
    case 'page':G.flags.pageCount=(G.flags.pageCount||0)+1;giveItem('page');break;
    case 'herb':G.flags.herbCount=(G.flags.herbCount||0)+1;giveItem('herb');break;
    case 'ore':giveItem('ore');break;
  }
}
function rollEncounter(){
  if(G.plane==='material'&&locAt(G.x,G.y))return false;
  const reg=regionAt(G.x,G.y);
  // 城镇与道路附近安全
  if(G.plane==='material'){
    for(const l of LOCS){if(l.plane==='material'&&Math.abs(l.x-G.x)+Math.abs(l.y-G.y)<=2)return false;}
  }
  let base=G.plane==='material'?0.09:0.13;
  if(reg.id==='road')base=0.05;
  if(G.cls==='ranger')base*=0.7;
  if(!isDaytime())base*=1.8;
  if(G.weather==='fog')base*=1.3;
  if(G.weather==='rain')base*=0.8;
  if(!R.chance(base))return false;
  const table=G.plane==='material'?reg.enc:PLANE_ENC[G.plane];
  if(!table)return false;
  const pick=R.pick(table);
  const cnt=R.ri(pick[1],pick[2]);
  const names={goblin:'哥布林',wolf:'狼群',bandit:'土匪',skeleton:'骷髅',specter:'幽灵',ghoul:'食尸鬼',zombie:'僵尸群',shadow:'暗影',imp:'小恶魔',orog:'兽人战团',fire_elemental:'火元素',winterwolf:'冬狼',yeti:'雪怪',astral_raider:'星界掠夺者',fey_knight:'妖精骑士',spider:'蛛群',ice_elemental:'冰元素',wraith:'幽魂'};
  const intros={
    material:'「有什么东西在'+reg.n+'的'+(isDaytime()?'日光':'阴影')+'中移动——是'+(names[pick[0]]||pick[0])+'！」',
    astral:'星海泛起涟漪，敌意的心灵贴近了……',
    elemental:'元素之怒凝聚成形！',
    shadow:'死者的低语骤然清晰！',
    fey:'宴席的乐曲变调成了狩猎的号角！',
  };
  Combat.start({monsters:[[pick[0],cnt]],intro:intros[G.plane]||intros.material,theme:reg.id});
  G.encounterCd=6;
  return true;
}
function travelTo(plane){
  if(plane===G.plane)return;
  G.plane=plane;
  const m=getMap(plane);
  initFog(plane);
  if(plane==='material'){G.x=40;G.y=7;}
  else{G.x=3;G.y=20;}
  revealFog();
  rollWeather();
  Game.log('你穿越位面之门，抵达【'+PLANES[plane].n+'】。','quest');
  banner(PLANES[plane].n);

  if(scene)scene.refreshAll();
  autoSave();
}

function longRest(inn){

  G.hp=G.hpMax;
  G.slotsUsed=[0,0,0,0,0];

  if(!inn&&G.plane==='material'&&R.chance(.2)){
    Game.log('半夜，你被逼近的脚步声惊醒！','combat');
    const reg=regionAt(G.x,G.y);
    const pick=R.pick(reg.enc);
    Combat.start({monsters:[[pick[0],1]],intro:'夜袭！'});
  }
  renderAll();autoSave();
}
function shortRest(safe){
  G.time+=60;
  if(G.time>=1440){G.time-=1440;G.day++;G.days++;rollWeather();}
  const hd=CLASSES[G.cls].hd;
  const heal=R.d(hd)+mod('con');
  G.hp=Math.min(G.hpMax,G.hp+heal);
  delete G.flags.swUsed;
  G.breathUsed=false;
  G.healPool=G.cls==='cleric'?G.level*3:G.healPool;
  Game.log('短休一小时，恢复 '+heal+' 生命。','gain');
  if(!safe&&G.plane==='material'&&R.chance(.15)){
    const reg=regionAt(G.x,G.y);
    const pick=R.pick(reg.enc);
    Combat.start({monsters:[[pick[0],1]],intro:'休息时遭遇敌人！'});
  }
  renderAll();autoSave();
}

function finaleDialog(){

  add('加冕星冠（灰烬主导：灰烬好感≥60）',()=>G.fav.ash>=60,null,()=>Game.ending('crown'));
  add('展开永夜之幕（幽影主导：幽影好感≥60）',()=>G.fav.shadow>=60,null,()=>Game.ending('night'));
  add('拍卖星核（商盟主导：商盟好感≥60 且金币≥3000）',()=>G.fav.trade>=60&&G.gold>=3000,null,()=>Game.ending('gold'));
  add('放开手，让位面自由交融（无前提）',()=>true,null,()=>Game.ending('free'));
  add('以身为烛，封印裂隙（无前提）',()=>true,null,()=>Game.ending('seal'));
  let html='<h3 class="text-lg font-bold text-ink mb-2">终局抉择</h3><p class="text-xs text-parch-700 mb-3">星灵的问题在颅腔里回荡。每个选择都是一个结局——选吧。</p><div class="space-y-1">';
  opts.forEach(o=>{
    if(o.lock)html+='<div class="btn w-full text-left" style="opacity:.4;cursor:not-allowed">（未达成）'+esc(o.lock)+'</div>';
    else html+='<button class="btn w-full text-left" onclick="finalePick(\''+o.label.slice(0,4)+'\')">▸ '+esc(o.label)+'</button>';
  });

function finalePick(key){
  const o=(window._finale||[]).find(x=>x.label.startsWith(key));
  if(o){closeModal();o.fn();}
}
window.finalePick=finalePick;

/* =====================================================
   Phaser 场景
===================================================== */
class WorldScene extends Phaser.Scene{
  constructor(){super('world');}
  create(){
    scene=this;
    this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');
    this.moveCd=0;
    this.terrG=this.add.graphics().setDepth(0);
    this.objLayer=this.add.container(0,0).setDepth(1);
    this.fogG=this.add.graphics().setDepth(2);
    this.unitG=this.add.graphics().setDepth(3);
    this.player=this.add.graphics().setDepth(4);
    this.overlay=this.add.graphics().setDepth(10).setScrollFactor(0);
    this.input.on('pointerdown',p=>{
      const tx=Math.floor(p.worldX/TS),ty=Math.floor(p.worldY/TS);
      if(Combat.active)Combat.onClick(tx,ty);
      else{
        if(Math.abs(tx-G.x)+Math.abs(ty-G.y)===1){
          tryMove(tx-G.x,ty-G.y);
        }
      }
    });
    this.refreshAll();
  }
  refreshAll(){
    if(!G)return;
    const m=getMap(G.plane);
    this.cameras.main.setBounds(0,0,m.w*TS,m.h*TS);
    this.cameras.main.startFollow(this.player,true,.15,.15);
    this.drawTerrain();this.drawObjects();this.drawFog();this.drawPlayer();this.drawOverlay();
  }
  drawTerrain(){
    const g=this.terrG;m0();
    const m=getMap(G.plane),pal=PLANES[G.plane].pal;
    g.clear();
    for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){
      const t=m.t[idx(x,y,m.w)];
      g.fillStyle(Phaser.Display.Color.HexStringToColor(pal[t]||pal[0]).color,1);
      g.fillRect(x*TS,y*TS,TS,TS);
      // 纹理点缀
      if(t===1){g.fillStyle(0x1d4a18,1);g.fillRect(x*TS+8,y*TS+6,8,12);g.fillStyle(0x2e6a26,1);g.fillRect(x*TS+4,y*TS+2,16,8);}
      else if(t===2){g.fillStyle(0x4a4a4a,1);g.fillRect(x*TS+4,y*TS+8,16,12);g.fillStyle(0x8a8a8a,1);g.fillRect(x*TS+8,y*TS+4,8,8);}
      else if(t===3){g.fillStyle(0x1d3a5a,1);g.fillRect(x*TS+3,y*TS+8,TS-6,6);}
      else if(t===4){g.fillStyle(0x8a7040,1);g.fillRect(x*TS,y*TS+9,TS,6);}
      else if(t===5){g.fillStyle(0x6a4030,1);g.fillRect(x*TS+2,y*TS+4,TS-4,16);g.fillStyle(0xc24a1d,1);g.fillRect(x*TS+8,y*TS+7,4,3);}
      else if(t===6){g.fillStyle(0x2a3a20,1);g.fillRect(x*TS+3,y*TS+12,7,4);g.fillRect(x*TS+13,y*TS+5,6,4);}
      else if(t===7){g.fillStyle(0xffffff,1);g.fillRect(x*TS+5,y*TS+5,4,4);g.fillRect(x*TS+14,y*TS+13,4,4);}
      else if(t===8){g.fillStyle(0x8a6a3a,1);g.fillRect(x*TS+4,y*TS+10,6,4);}
      else if(t===9){g.fillStyle(0xff8a1d,1);g.fillRect(x*TS+3,y*TS+6,TS-6,TS-10);}
      else if(t===10){g.fillStyle(0x6a5030,1);g.fillRect(x*TS,y*TS+4,TS,16);}
      else if(t===11){g.fillStyle(0x1d1030,1);g.fillRect(x*TS+2,y*TS+2,TS-4,TS-4);g.fillStyle(0x6a5aaa,1);g.fillRect(x*TS+8,y*TS+8,6,6);}
    }
    function m0(){}
  }
  drawObjects(){
    const c=this.objLayer;
    c.removeAll(true);
    LOCS.filter(l=>l.plane===G.plane).forEach(l=>{
      const seen=G.fog[G.plane]&&G.fog[G.plane][idx(l.x,l.y,getMap(G.plane).w)];
      if(!seen)return;
      const bg=this.add.circle(l.x*TS+TS/2,l.y*TS+TS/2,10,0x3a2b16).setStrokeStyle(2,0xd3b476);
      const tx=this.add.text(l.x*TS+TS/2,l.y*TS+TS/2,l.g,{font:'bold 12px Georgia',color:'#f0e2bd'}).setOrigin(.5);
      c.add([bg,tx]);
    });
  }
  drawFog(){
    const g=this.fogG;
    g.clear();
    if(!G.fog[G.plane])return;
    const m=getMap(G.plane);
    const vr=6+(RACES[G.race].dark?2:0)+(f('blessStar')?1:0);
    for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){
      const seen=G.fog[G.plane][idx(x,y,m.w)];
      if(!seen){g.fillStyle(0x000000,1);g.fillRect(x*TS,y*TS,TS,TS);continue;}
      const d=Math.abs(x-G.x)+Math.abs(y-G.y);
      const dd=Math.max(Math.abs(x-G.x),Math.abs(y-G.y));
      if(dd>vr){
        const night=!isDaytime();
        g.fillStyle(0x000000,night?.72:.62);
        g.fillRect(x*TS,y*TS,TS,TS);
      }else if(dd>vr-2){
        g.fillStyle(0x000000,.25);
        g.fillRect(x*TS,y*TS,TS,TS);
      }
    }
  }
  drawPlayer(){
    const g=this.player;
    g.clear();
    const px=G.x*TS+TS/2,py=G.y*TS+TS/2;
    g.setPosition(px,py);
    const col=Phaser.Display.Color.HexStringToColor(CLASSES[G.cls].color).color;
    g.fillStyle(col,1);
    g.fillCircle(0,0,7);
    g.fillStyle(0xf0e2bd,1);
    g.fillCircle(0,-2,3);
    g.lineStyle(2,0xf0e2bd,.9);
    g.strokeCircle(0,0,7);
  }
  drawOverlay(){
    const g=this.overlay;
    g.clear();
    const W=this.scale.width,H=this.scale.height;
    // 昼夜
    let alpha=0,color=0x000000;
    const hour=G.time/60;
    if(hour<5||hour>=20){alpha=.32;color=0x0a0a2a;}
    else if(hour<8){alpha=.15;color=0x3a2a5a;}
    else if(hour>=17&&hour<20){alpha=.18;color=0x5a2a1a;}
    if(G.weather==='rain'){alpha=Math.min(.5,alpha+.15);color=0x1a2a4a;}
    if(G.weather==='storm'){alpha=Math.min(.55,alpha+.22);color=0x1a1a3a;}
    if(G.weather==='fog'&&G.plane==='material'){alpha=Math.min(.5,alpha+.12);color=0x8a8a7a;}
    if(alpha>0){g.fillStyle(color,alpha);g.fillRect(0,0,W,H);}
  }
  /* ---- 战斗渲染 ---- */
  enterCombat(){
    this.drawCombatInit();
  }
  exitCombat(){
    $('combatBar').classList.add('hidden');
    $('combatBar').innerHTML='';
    this.refreshAll();
  }
  drawCombatInit(){
    this.drawCombat();
  }
  drawCombat(){
    if(!Combat.active)return;
    const a=Combat.arena;
    const pal={0:'#5d8a3c',1:'#2e5a26',2:'#6b6b6b',3:'#2f5d8a',6:'#4a5d3a',7:'#d8d8e2',8:'#b09a5f',11:'#3a2a5a',12:'#7a7a72'};
    const g=this.terrG;
    g.clear();
    for(let y=0;y<a.h;y++)for(let x=0;x<a.w;x++){
      const t=a.t[idx(x,y,a.w)];
      g.fillStyle(Phaser.Display.Color.HexStringToColor(pal[t]||pal[0]).color,1);
      g.fillRect(x*TS,y*TS,TS,TS);
      g.lineStyle(1,0x000000,.12);
      g.strokeRect(x*TS,y*TS,TS,TS);
    }
    // 高亮可达
    const u=Combat.unit('p');
    if(u&&Combat.unit(Combat.order[Combat.turn])===u&&Combat.phase==='move'&&!Combat.moved){
      const reach=Combat.bfs(u,u.speed);
      for(const k in reach.dist){
        if(reach.dist[k]===0)continue;
        const [x,y]=k.split(',').map(Number);
        g.fillStyle(0xffffff,.16);
        g.fillRect(x*TS+2,y*TS+2,TS-4,TS-4);
      }
    }
    // 单位
    const ug=this.unitG;
    ug.clear();
    Combat.units.forEach(t=>{
      if(t.dead)return;
      const px=t.x*TS+TS/2,py=t.y*TS+TS/2;
      const isP=t.side==='p';
      ug.fillStyle(isP?0x3f6d33:0x8a2f1d,1);
      ug.fillCircle(px,py,8);
      ug.lineStyle(2,0xf0e2bd,1);
      ug.strokeCircle(px,py,8);
      ug.fillStyle(0x000000,.5);
      ug.fillRect(px-9,py-14,18,4);
      ug.fillStyle(isP?0x6ac46a:0xc44a4a,1);
      ug.fillRect(px-9,py-14,18*Math.max(0,t.hp/t.hpMax),4);
      if(t.cond.invis){ug.fillStyle(0xffffff,.4);ug.fillCircle(px,py,8);}
    });
    // 玩家标记
    this.drawCombatPlayerMarker(u);
    this.cameras.main.setBounds(0,0,a.w*TS,a.h*TS);
    if(u){this.cameras.main.centerOn(u.x*TS+TS/2,u.y*TS+TS/2);}
  }
  drawCombatPlayerMarker(u){
    const g=this.player;
    g.clear();
    if(!u||u.dead)return;
    g.setPosition(u.x*TS+TS/2,u.y*TS+TS/2);
    const col=Phaser.Display.Color.HexStringToColor(CLASSES[G.cls].color).color;
    g.fillStyle(col,1);g.fillCircle(0,0,9);
    g.lineStyle(3,0xf0e2bd,1);g.strokeCircle(0,0,9);
  }
  update(time,delta){
    if(!G||!G.created||Game.ended)return;
    if(Combat.active||Dlg.active||modalOpen())return;
    if(this.moveCd>0){this.moveCd-=delta;return;}
    const k=this.keys;
    let dx=0,dy=0;
    if(k.LEFT.isDown||k.A.isDown)dx=-1;
    else if(k.RIGHT.isDown||k.D.isDown)dx=1;
    else if(k.UP.isDown||k.W.isDown)dy=-1;
    else if(k.DOWN.isDown||k.S.isDown)dy=1;
    if(dx||dy){tryMove(dx,dy);this.moveCd=130;}
  }
}

/* =====================================================
   UI 渲染
===================================================== */
function renderAll(){renderTopbar();renderStory();}
function renderTopbar(){
  if(!G)return;
  $('tbPlane').textContent=PLANES[G.plane].n;
  const hour=Math.floor(G.time/60);
  const seg=hour<5?'深夜':hour<8?'清晨':hour<12?'上午':hour<17?'午后':hour<20?'黄昏':'夜晚';
  $('tbTime').textContent='第'+G.day+'天 · '+seg;
  $('tbWeather').textContent={clear:'晴',rain:'雨',fog:'雾',storm:'暴风雨'}[G.weather]||G.weather;
  $('tbHP').style.width=Math.max(0,G.hp/G.hpMax*100)+'%';
  $('tbHPn').textContent=G.hp+'/'+G.hpMax;
  $('tbAC').textContent=computeAC();
  $('tbGold').textContent=G.gold;
  $('tbShard').textContent=G.shards;
}
function renderStory(){
  const box=$('tabContent');
  if(!G||!G.created){box.innerHTML='<div class="text-sm text-parch-600">尚未开始冒险。</div>';return;}
  if(Dlg.active&&Dlg.node){box.innerHTML=renderDialogue();box.scrollTop=box.scrollHeight;return;}
  if(curTab==='story'){
    let html='';
    G.log.slice(-120).forEach(l=>{
      html+='<div class="logline '+(l.c?'log-'+l.c:'')+'">'+esc(l.t)+'</div>';
    });
    if(!html)html='<div class="text-sm text-parch-600">（暂无记录）</div>';
    box.innerHTML=html;
    box.scrollTop=box.scrollHeight;
  }else if(curTab==='char')renderChar(box);
  else if(curTab==='inv')renderInv(box);
  else if(curTab==='spell')renderSpells(box);
  else if(curTab==='quest')renderQuests(box);
  else if(curTab==='sys')renderSys(box);
}
function renderChar(box){
  const c=CLASSES[G.cls],rc=RACES[G.race],bg=BGS[G.bg];
  const favn=[['church','星辉教会','#8a7030'],['ash','灰烬兄弟会','#8a4030'],['shadow','幽影议会','#4a3a5a'],['trade','自由商盟','#3f6d33']];
  let html='<div class="card mb-2"><div class="flex justify-between items-baseline"><b class="text-lg text-ink">'+esc(G.name)+'</b><span class="text-xs text-parch-600">'+rc.n+' · '+c.n+' · '+bg.n+'</span></div>'+
    '<div class="text-xs text-parch-700 mt-1">'+rc.trait+'</div>'+
    '<div class="text-xs text-parch-700">职业特性：'+c.feat+'</div></div>';
  html+='<div class="grid grid-cols-3 gap-1 mb-2">';
  ABILS.forEach(a=>{
    html+='<div class="card text-center"><div class="text-xs text-parch-600">'+ABILN[a]+'</div><b class="text-lg">'+G.stats[a]+'</b> <span class="text-xs">('+((mod(a))>=0?'+':'')+mod(a)+')</span></div>';
  });
  html+='</div>';
  html+='<div class="grid grid-cols-2 gap-1 text-xs mb-2">';
  html+='<div class="card">等级 <b>'+G.level+'</b></div><div class="card">经验 <b>'+G.xp+'</b>'+(G.level<10?' / '+XP_TABLE[G.level+1]:'（满级）')+'</div>';
  html+='<div class="card">生命 <b>'+G.hp+'/'+G.hpMax+'</b></div><div class="card">AC <b>'+computeAC()+'</b></div>';
  html+='<div class="card">熟练 '+prof()+'</div><div class="card">法术DC '+spellDC()+'</div>';
  html+='</div>';
  html+='<div class="card mb-2"><div class="text-xs font-bold mb-1">技能熟练</div><div class="text-xs text-parch-700">'+(G.skills.join('、')||'无')+'</div></div>';
  if(CLASSES[G.cls].casting){
    const maxA=slotsMaxFor(G.level,G.cls);
    html+='<div class="card mb-2"><div class="text-xs font-bold mb-1">法术位</div>';
    maxA.forEach((n,i)=>{
      const used=G.slotsUsed[i]||0;
      html+='<span class="text-xs mr-2">'+(i+1)+'环：'+(n-used)+'/'+n+'</span>';
    });
    html+='</div>';
  }
  html+='<div class="card"><div class="text-xs font-bold mb-1">阵营好感</div>';
  favn.forEach(([k,n,col])=>{
    html+='<div class="flex items-center gap-2 text-xs mb-1"><span style="width:80px">'+n+'</span><div class="hpbar flex-1"><div style="width:'+G.fav[k]+'%;background:'+col+'"></div></div><span>'+G.fav[k]+'</span></div>';
  });
  html+='</div>';
  if(G.memory&&Object.keys(G.memory).length){
    html+='<div class="card mt-2"><div class="text-xs font-bold mb-1">羁绊记忆</div>';
    Object.keys(G.memory).forEach(k=>{
      html+='<div class="text-xs text-parch-700">· '+esc(NPCS[k]?NPCS[k].name:k)+'：'+esc(G.memory[k].map(m=>m.t).slice(-2).join('；'))+'</div>';
    });
    html+='</div>';
  }
  box.innerHTML=html;
}
function renderInv(box){
  let html='<div class="text-xs text-parch-700 mb-2">金币：<b class="text-yellow-700">'+G.gold+'</b> · 点击装备栏更换装备</div>';
  const slots=[['weapon','武器'],['armor','护甲'],['shield','盾牌'],['trinket','饰品']];
  html+='<div class="grid grid-cols-2 gap-1 mb-2">';
  slots.forEach(([k,n])=>{
    const id=G.equip[k];
    html+='<div class="card text-xs"><div class="text-parch-600">'+n+'</div><b>'+(id?esc(ITEMS[id].n):'（空）')+'</b></div>';
  });
  html+='</div><div class="space-y-1">';
  if(!G.inv.length)html+='<div class="text-sm text-parch-600">（背包空空如也）</div>';
  G.inv.forEach((it,i)=>{
    const item=ITEMS[it.id];
    const canEquip=item.type==='weapon'||item.type==='armor'||item.type==='shield';
    html+='<div class="card flex items-center gap-2 text-xs">'+
      '<div class="flex-1"><b>'+esc(item.n)+'</b>×'+it.qty+' <span class="text-parch-600">'+(item.desc||'')+(item.dmg?' 伤害'+item.dmg:'')+'</span></div>';
    if(canEquip)html+='<button class="btn" onclick="equipItem('+i+')">装备</button>';
    if(item.type==='potion')html+='<button class="btn btn-green" onclick="usePotion('+i+')">饮用</button>';
    if(item.type==='trinket'&&it.id==='dragonorb')html+='<button class="btn" onclick="toast(\'在战斗中使用\')">战斗用</button>';
    if(item.type!=='quest'&&it.id!=='shard')html+='<button class="btn btn-red" onclick="sellItem('+i+')">卖'+Math.floor((item.price||0)/2)+'金</button>';
    html+='</div>';
  });
  html+='</div>';
  box.innerHTML=html;
}
window.equipItem=function(i){
  const it=G.inv[i];if(!it)return;
  const item=ITEMS[it.id];
  const slot=item.type==='weapon'?'weapon':item.type==='armor'?'armor':item.type==='shield'?'shield':'trinket';
  const old=G.equip[slot];
  removeItem(it.id,1);
  if(old)giveItem(old,1);
  G.equip[slot]=it.id;
  if(slot==='weapon')Game.log('装备了【'+item.n+'】。','sys');
  else Game.log('装备了【'+item.n+'】（AC调整）。','sys');
  renderTopbar();renderStory();
};
window.usePotion=function(i){
  const it=G.inv[i];if(!it)return;
  const item=ITEMS[it.id];
  if(item.heal){
    const amount=R.roll(item.heal);
    G.hp=Math.min(G.hpMax,G.hp+amount);
    removeItem(it.id,1);
    Game.log('饮下【'+item.n+'】，恢复 '+amount+' 生命。','gain');SFX.play('heal');
  }else if(item.fireres){
    setF2('fireRes',G.day);
    removeItem(it.id,1);
    Game.log('抗火药水生效（今日火焰伤害减半）。','gain');
  }
  renderTopbar();renderStory();
};
window.sellItem=function(i){
  const it=G.inv[i];if(!it)return;
  const item=ITEMS[it.id];
  const price=Math.floor((item.price||0)/2);
  if(price<=0){toast('这个卖不出价');return;}
  removeItem(it.id,1);
  gainGold(price);
  renderStory();
};
function renderSpells(box){
  if(!CLASSES[G.cls].casting){
    box.innerHTML='<div class="text-sm text-parch-600">你不会施法。职业特性：'+CLASSES[G.cls].feat+'</div>';
    return;
  }
  const maxA=slotsMaxFor(G.level,G.cls);
  let html='<div class="card mb-2 text-xs">法术位：';
  maxA.forEach((n,i)=>{html+=(i+1)+'环 '+(n-(G.slotsUsed[i]||0))+'/'+n+'　';});
  html+='</div><div class="space-y-1">';
  const known=G.spells.length?G.spells:CLASSES[G.cls].spells.filter(s=>SPELLS[s].lvl<=maxSpellLvl());
  if(!known.length)html+='<div class="text-sm text-parch-600">尚未掌握法术。</div>';
  known.forEach(sid=>{
    const sp=SPELLS[sid];
    const avail=sp.lvl===0||slotsAvail(sp.lvl)>0;
    html+='<div class="card flex items-center gap-2 text-xs">'+
      '<div class="flex-1"><b>'+esc(sp.n)+'</b> <span class="text-parch-600">'+(sp.lvl===0?'戏法':sp.lvl+'环')+' · '+(sp.dmg?sp.dmg+' '+sp.type:sp.heal?'治疗'+sp.heal:'增益')+' · 射程'+(sp.rng?sp.rng*5:'接触')+'尺</span></div>';
    if(sp.heal||sp.rest)html+='<button class="btn btn-green" '+(avail?'':'disabled')+' onclick="castOutOfCombat(\''+sid+'\')">施放</button>';
    else html+='<span class="text-xs text-parch-600">战斗中使用</span>';
    html+='</div>';
  });
  html+='</div>';
  box.innerHTML=html;
}
window.castOutOfCombat=function(sid){
  const sp=SPELLS[sid];
  if(sp.lvl>0&&slotsAvail(sp.lvl)<=0){toast('没有法术位');return;}
  if(sp.lvl>0)useSlot(sp.lvl);
  if(sp.heal){
    const amount=R.roll(sp.heal)+castMod();
    G.hp=Math.min(G.hpMax,G.hp+amount);
    Game.log('施放【'+sp.n+'】，恢复 '+amount+' 生命。','gain');SFX.play('heal');
  }else if(sp.rest){
    Game.log('次级复原术：身心一新。','gain');
  }
  renderTopbar();renderStory();
};
function renderQuests(box){
  let html='<div class="space-y-1">';
  let any=false;
  Object.keys(QUESTS).forEach(id=>{
    const st=G.quests[id];
    const active=st&&!st.done;
    const recent=st&&st.done;
    if(!active&&!recent)return;
    any=true;
    const q=QUESTS[id];
    const col=q.type==='主线'?'text-blood':q.type==='阵营'?'text-arc':'text-sage';
    html+='<div class="card '+(active?'sel':'')+'"><div class="text-xs font-bold '+col+'">['+q.type+']</div><b class="text-sm">'+esc(q.n)+'</b>'+
      '<div class="text-xs text-parch-700 mt-1">'+esc(questText(id))+'</div>'+(st.done?'<div class="text-xs text-sage mt-1">已完成</div>':'')+'</div>';
  });
  if(!any)html+='<div class="text-sm text-parch-600">（暂无任务——去新月镇找镇长艾德温）</div>';
  html+='</div>';
  box.innerHTML=html;
}
function renderSys(box){
  let html='<div class="space-y-2 text-xs">';
  html+='<div class="card"><b class="text-sm">存档</b><div class="mt-1 flex gap-1"><button class="btn" onclick="Game.save()">手动存档</button><button class="btn" onclick="Game.load();scene&&scene.refreshAll()">读取存档</button><button class="btn btn-red" onclick="localStorage.removeItem(SAVE_KEY);toast(\'存档已删除\')">删除存档</button></div><div class="text-parch-600 mt-1">任务进度与长休时会自动存档。</div></div>';
  html+='<div class="card"><b class="text-sm">设置</b><div class="mt-1 flex gap-1"><button class="btn" onclick="toggleSound()">音效：'+(G.settings.sound?'开':'关')+'</button><button class="btn" onclick="toggleBgm()">环境音：'+(G.settings.bgm?'开':'关')+'</button></div></div>';
  html+='<div class="card"><b class="text-sm">骰子面板</b><div class="mt-1 flex flex-wrap gap-1">';
  [['d20',20],['d12',12],['d10',10],['d8',8],['d6',6],['d4',4]].forEach(([n,s])=>{
    html+='<button class="btn" onclick="rollDice(\''+n+'\','+s+')">'+n+'</button>';
  });
  html+='<button class="btn btn-blue" onclick="rollDice(\'优势d20\',20,1)">优势d20</button>';
  html+='<button class="btn btn-blue" onclick="rollDice(\'劣势d20\',20,-1)">劣势d20</button>';
  html+='</div></div>';
  html+='<div class="card"><b class="text-sm">冒险统计</b><div class="mt-1 text-parch-700">历时 '+G.days+' 天 · 击杀 '+G.kills+' · 位面 '+Object.keys(G.planesUnlocked).length+'/5 · 星核 '+G.shards+'/4</div></div>';
  html+='<div class="card"><b class="text-sm">操作</b><div class="mt-1 text-parch-700">WASD/方向键或点击相邻格移动。走到地点图块触发事件。战斗中点击格子/敌人执行动作。</div></div>';
  html+='</div>';
  box.innerHTML=html;
}
window.toggleSound=function(){G.settings.sound=!G.settings.sound;renderStory();};
window.toggleBgm=function(){G.settings.bgm=!G.settings.bgm;SFX.bgm(G.settings.bgm);renderStory();};
window.rollDice=function(name,sides,adv){
  const r=R.rollD20(0,adv||0);
  dicePopup(name,r.nat+(adv?'（'+(adv>0?'优势':'劣势')+'）':''),'d'+sides+' 原始值：'+r.nat+(r.other?'/'+r.other:''));
  SFX.play('dice');
};
window.Game=Game;window.closeModal=closeModal;window.toast=toast;
window.Dlg=Dlg;window.longRest=longRest;window.shortRest=shortRest;

/* =====================================================
   屏幕流程
===================================================== */
function showGameUI(){
  $('titleScreen').classList.add('hidden');
  $('createScreen').classList.add('hidden');
  $('gameUI').classList.remove('hidden');
  $('gameUI').classList.add('flex');
}
const CState={race:'human',cls:'fighter',bg:'acolyte',stats:null};
function rollStats(){
  const rolls=[];
  for(let i=0;i<6;i++){
    const d=[R.d(6),R.d(6),R.d(6),R.d(6)].sort((a,b)=>a-b);
    rolls.push(d[1]+d[2]+d[3]);
  }
  rolls.sort((a,b)=>b-a);
  const prio=CLASSES[CState.cls].prio;
  const stats={};
  prio.forEach((ab,i)=>stats[ab]=rolls[i]);
  CState.stats=stats;
  renderCreate();
}
function renderCreate(){
  // 种族
  $('raceRow').innerHTML=Object.keys(RACES).map(k=>{
    const r=RACES[k];
    return '<div class="card '+(CState.race===k?'sel':'')+' cursor-pointer text-xs" onclick="selRace(\''+k+'\')"><b>'+r.n+'</b><div class="text-parch-600">'+Object.keys(r.asi).map(a=>'+'+r.asi[a]+' '+ABILN[a]).join(' ')+'</div><div class="text-parch-700 mt-0.5">'+r.trait+'</div></div>';
  }).join('');
  // 职业
  $('clsRow').innerHTML=Object.keys(CLASSES).map(k=>{
    const c=CLASSES[k];
    return '<div class="card '+(CState.cls===k?'sel':'')+' cursor-pointer text-xs" onclick="selClass(\''+k+'\')"><b>'+c.n+'</b><div class="text-parch-600">d'+c.hd+' · 主属性'+ABILN[c.prio[0]]+'</div><div class="text-parch-700 mt-0.5">'+c.feat.slice(0,28)+'…</div></div>';
  }).join('');
  // 背景
  $('bgRow').innerHTML=Object.keys(BGS).map(k=>{
    const b=BGS[k];
    return '<div class="card '+(CState.bg===k?'sel':'')+' cursor-pointer text-[10px] px-1" onclick="selBg(\''+k+'\')"><b>'+b.n+'</b></div>';
  }).join('');
  // 属性
  if(CState.stats){
    $('statBox').innerHTML=ABILS.map(a=>'<div class="card px-2 py-1">'+ABILN[a]+' <b>'+CState.stats[a]+'</b></div>').join('');
  }
  // 摘要
  const c=CLASSES[CState.cls],rc=RACES[CState.race];
  const hp=c.hd+((CState.stats&&mod2('con',CState.stats))||0);
  $('createSummary').innerHTML=CState.stats?
    ('生命上限预估 <b>'+(c.hd+Math.floor((CState.stats.con-10)/2)+1)+'</b> · 初始装备：'+c.gear.map(g=>ITEMS[g[0]].n).join('、')+
    (c.spells?' · 起始法术：'+c.spells.filter(s=>SPELLS[s].lvl<=1).map(s=>SPELLS[s].n).join('、'):'')):
    '点击「重掷属性」开始。';
}
window.mod2=mod2;
function mod2(a,st){return Math.floor((st[a]-10)/2);}
window.selRace=function(k){CState.race=k;rollStats();};
window.selClass=function(k){CState.cls=k;rollStats();};
window.selBg=function(k){CState.bg=k;renderCreate();};

function boot(){
  // 标题按钮
  $('btnNew').onclick=()=>{
    SFX.play('click');
    $('titleScreen').classList.add('hidden');
    $('createScreen').classList.remove('hidden');
    rollStats();
  };
  $('btnBackT').onclick=()=>{$('createScreen').classList.add('hidden');$('titleScreen').classList.remove('hidden');};
  $('btnRoll').onclick=()=>{SFX.play('dice');rollStats();};
  $('btnStart').onclick=()=>{
    const name=$('inpName').value.trim()||'无名者';
    if(!CState.stats)rollStats();
    Game.newGame({name,race:CState.race,cls:CState.cls,bg:CState.bg,stats:CState.stats});
  };
  $('btnContinue').onclick=()=>{if(!Game.load())toast('没有可用存档');};
  $('btnHelpT').onclick=showHelp;
  $('btnHelp').onclick=showHelp;
  $('btnRestart').onclick=()=>location.reload();
  // 顶栏
  $('btnQSave').onclick=()=>Game.save();
  $('btnRest').onclick=()=>{
    openModal('<h3 class="text-lg font-bold mb-2">休息</h3>'+
      '<button class="btn w-full mb-1" onclick="closeModal();longRest(true)">长休（旅店标准，10金币，全恢复）</button>'+
      '<button class="btn w-full" onclick="closeModal();shortRest(true)">短休（1小时，恢复1颗骰）</button>');
  };
  $('btnHere').onclick=()=>{
    if(Game.busy())return;
    const loc=locAt(G.x,G.y);
    if(loc)showLocMenu(loc);
    else{
      const reg=regionAt(G.x,G.y);
      openModal('<h3 class="text-lg font-bold mb-1">'+esc(reg.n)+'</h3><p class="text-xs text-parch-700">'+(G.plane==='material'?'野外荒地，留意四周的动静。':'异界荒野，空气里弥漫着陌生的法则。')+'</p><div class="text-right mt-2"><button class="btn" onclick="closeModal()">关闭</button></div>');
    }
  };
  $('btnSnd').onclick=()=>{G.settings.sound=!G.settings.sound;$('btnSnd').textContent='音效:'+(G.settings.sound?'开':'关');};
  // 存档按钮
  const hasSave=!!localStorage.getItem(SAVE_KEY);
  if(hasSave)$('btnContinue').classList.remove('hidden');
  // Phaser
  if(window.Phaser){
    phaserGame=new Phaser.Game({
      type:Phaser.AUTO,parent:'phaserHost',width:1000,height:660,
      pixelArt:true,backgroundColor:'#100c06',
      scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
      scene:[WorldScene]
    });
  }else{
    setTimeout(()=>{
      if(!window.Phaser)openModal('<h3 class="text-lg font-bold text-blood mb-2">资源加载失败</h3><p class="text-sm">Phaser3 CDN 未能加载，请检查网络后刷新页面。</p>');
    },3000);
  }
  // 快捷键
  window.addEventListener('keydown',e=>{
    if(!G||!G.created)return;
    if(e.key==='Escape'){if(modalOpen())closeModal();else if(Dlg.active)Dlg.close();}
  });
}
function showHelp(){
  openModal('<h3 class="text-xl font-bold text-ink mb-2">玩法说明</h3>'+
  '<div class="text-sm leading-relaxed text-parch-800 space-y-2">'+
  '<p><b>目标：</b>集齐4枚星核碎片，登上星陨坑的星核祭坛，在6种结局中做出你的抉择。</p>'+
  '<p><b>移动：</b>WASD/方向键或点击相邻格子。走到城镇/地点图块自动触发事件，迷雾会随探索散开。</p>'+
  '<p><b>主线：</b>新月镇找镇长 → 各阵营首领处完成阵营任务解锁位面 → 进入各≪星槎残骸/元素圣殿/静默回廊/宴会树≫夺取碎片 → 回星陨坑终局。</p>'+
  '<p><b>战斗：</b>DND5E规则——先攻决定顺序；每回合可移动+行动（攻击/施法/物品/躲避）。注意借机攻击与优势劣势。</p>'+
  '<p><b>检定：</b>d20+调整值 vs DC。技能熟练、装备、灵感徽章都会影响结果。</p>'+
  '<p><b>死亡：</b>生命归零进入死亡豁免（3胜稳定/3败死亡），死亡后可读档。</p>'+
  '<p><b>存档：</b>系统页手动存读档；任务推进与长休自动存档。</p>'+
  '</div><div class="text-right mt-3"><button class="btn" onclick="closeModal()">明白了</button></div>');
}
document.addEventListener('DOMContentLoaded',boot);
</script>
